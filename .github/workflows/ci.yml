---
name: CI

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

jobs:
  lint:
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      statuses: write
    # SwiftLint needs SourceKit, which the macOS runners ship.
    runs-on: macos-latest
    steps:
      - uses: hugoh/gh-workflows/setup@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
      - uses: hugoh/gh-workflows/hk-check@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
      - run: mise run test:unit
      # Hosted runners have no audio device or capture permission, so the two tap scenarios are skipped there.
      - run: mise run test:e2e
        env:
          AIRTAP_E2E_CAPTURE: "0"

  ci-gate:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: ci-gate
    if: github.event_name != 'pull_request'
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: hugoh/gh-workflows/setup@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
        with:
          fetch-depth: "0"

      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual bump_type dispatch must run on main (got ${GITHUB_REF})"
          exit 1

      - name: Semver release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: bump
          args: --${{ inputs.bump_type || 'auto' }}

      - name: Determine tag
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.tag.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"

      - name: Build airtap CLI release binary
        if: steps.tag.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          swift build -c release --product airtap
          BIN=".build/release/airtap"
          strip "$BIN"
          codesign --force --options runtime --sign - "$BIN"
          mkdir -p dist
          tar -czf "dist/airtap-${VERSION}-aarch64-apple-darwin.tar.gz" -C .build/release airtap

      - name: Build & bundle Airtap.app
        if: steps.tag.outputs.skip != 'true'
        env:
          AIRTAP_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          scripts/make-app.sh
          ditto -c -k --sequesterRsrc --keepParent build/Airtap.app "dist/Airtap-${AIRTAP_VERSION}.zip"

      - name: Create GitHub release
        if: steps.tag.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "${TAG}" dist/* --generate-notes

      - name: Update Homebrew tap
        if: steps.tag.outputs.skip != 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mise run release:homebrew-tap -- "${VERSION}" \
            "dist/airtap-${VERSION}-aarch64-apple-darwin.tar.gz" \
            "dist/Airtap-${VERSION}.zip"
