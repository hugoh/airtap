---
name: Release

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: hugoh/gh-workflows/setup@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
        with:
          fetch-depth: "0"

      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual bump_type dispatch must run on main (got ${GITHUB_REF})"
          exit 1

      - name: Semver release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: bump
          args: --${{ inputs.bump_type || 'auto' }}

      - name: Determine tag
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.tag.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"

      - name: Build airtap CLI release binary
        if: steps.tag.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          swift build -c release --product airtap
          BIN=".build/release/airtap"
          strip "$BIN"
          codesign --force --options runtime --sign - "$BIN"
          mkdir -p dist
          tar -czf "dist/airtap-${VERSION}-aarch64-apple-darwin.tar.gz" -C .build/release airtap

      - name: Build & bundle Airtap.app
        if: steps.tag.outputs.skip != 'true'
        env:
          AIRTAP_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          scripts/make-app.sh
          ditto -c -k --sequesterRsrc --keepParent build/Airtap.app "dist/Airtap-${AIRTAP_VERSION}.zip"

      - name: Create GitHub release
        if: steps.tag.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "${TAG}" dist/* --generate-notes

      - name: Update Homebrew tap
        if: steps.tag.outputs.skip != 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mise run release:homebrew-tap -- "${VERSION}" \
            "dist/airtap-${VERSION}-aarch64-apple-darwin.tar.gz" \
            "dist/Airtap-${VERSION}.zip"
