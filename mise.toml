[tools]
jactionlint = "2.5.0"
pinact = "5.0.2"
biome = "2.6.6"
ghalint = "1.6.0"
gitleaks = "8.30.1"
hk = "2.11.1"
ruff = "0.17.4"
rumdl = "0.3.2"
shellcheck = "0.11.0"
"github:anordal/shellharden" = "4.3.2"
shfmt = "3.14.1"
swiftlint = "0.65.1"
tombi = "1.10.0"
ty = "0.0.99"
typos = "1.52.0"
uv = "0.13.7"
"github:owenlamont/ryl" = "0.29.0"

[tasks.test]
description = "Run unit tests and the end-to-end scenarios"
depends = ["test:unit", "test:e2e"]

[tasks."test:unit"]
description = "Run the Swift unit tests"
run = "swift test"

[tasks."test:e2e"]
description = "Run the sender against the fake AirPlay speaker (set AIRTAP_E2E_CAPTURE=0 where no audio device exists)"
run = ["swift build", "./scripts/e2e.py"]

[tasks.app]
description = "Build build/Airtap.app"
run = "scripts/make-app.sh"
